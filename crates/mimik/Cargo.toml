[package]
name = "mimik"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Real-time programmable voice changer for macOS"
keywords = ["voice-changer", "audio", "dsp", "cli", "pitch-shift"]
categories = ["command-line-utilities", "multimedia::audio"]

[[bin]]
name = "mimik"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
mimik-audio = { path = "../mimik-audio", version = "0.1.0" }
mimik-core = { path = "../mimik-core", version = "0.1.0" }
mimik-dsp = { path = "../mimik-dsp", version = "0.1.0" }
